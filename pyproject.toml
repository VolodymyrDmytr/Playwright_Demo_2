[project]
name = "playwright-demo-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Volodymyr Dmytriiev",email = "volodymyr.dmytriiev.o@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-playwright (>=0.8.0,<0.9.0)",
    "playwright (>=1.60.0,<2.0.0)",
    "pytest-timeout (>=2.4.0,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "allure-pytest (>=2.16.0,<3.0.0)",
]

[tool.poetry]
packages = [{include = "playwright_demo_2", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
