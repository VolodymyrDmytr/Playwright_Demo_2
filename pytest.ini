[pytest]
timeout = 25000
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s : %(name)s : %(levelname)s : %(message)s
log_file = Log_file.log
log_file_level = DEBUG
log_file_format = %(asctime)s : %(name)s : %(levelname)s : %(message)s
markers =
    home_page: UI tests for home page
    dynamic_id_page: UI tests for dynamic id page
    class_attribute_page: UI tests for class attribute page
    hidden_layers_page: UI tests for Hidden Layers page
    load_delays_page: UI tests for Load Delays page
    ajax_data_page: UI tests for AJAX Data page
    client_side_delay_page: UI tests for Client Side Delay page
    click_page: UI tests for Click page
    text_input_page: UI tests for Text Input page
    scrollbars_page: UI tests for Scrollbars page
    dynamic_table_page: UI tests for Dynamic Table page
    verify_text_page: UI tests for Verify Text page
    progress_bar_page: UI tests for Progress Bar page
    visibility_page: UI tests for Visibility page
    sample_app_page: UI tests for Sample App page
    mouse_over_page: UI tests for Mouse Over page
    nbsp_page: UI tests for Non-Breaking Space page
    overlapped_element_page: UI tests for Overlapped Element page
    shadow_dom_page: UI tests for Shadow DOM page
    alerts_page: UI tests for Alerts page
    file_upload_page: UI tests for File Upload page
    animated_button_page: UI tests for Animated Button page
    disabled_input_page: UI tests for Disabled Input page
    auto_wait_page: UI tests for Auto Wait page
    frames_page: UI tests for Frames page
    clear_input_page: UI tests for Clear Input page
    scroll_to_click_page: UI tests for Scroll to Click page
    css_selectors_page: UI tests for CSS Selectors page
